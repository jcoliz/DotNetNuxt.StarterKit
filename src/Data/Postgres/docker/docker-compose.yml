version: '3.4'
x-name: pg_dnn_development
services:
  db:
    image: postgres:15.4-alpine
    container_name: postgres_dnn
    restart: always
    ports:
      - '5500:5432'
    environment:
      - POSTGRES_PASSWORD=dnn_development
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - PGUSER=postgres
    volumes:
      - pg_dnn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL" , "pg_isready" ]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - pg_dnn_development

volumes:
  pg_dnn_pgdata:

networks:
  pg_dnn_development:
