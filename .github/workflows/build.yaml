name: Build

on:
  push:
    branches: [ main ]

env:
  SOLUTION_VERSION: 'github-${{ github.sha }}'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run Unit Tests
      run: dotnet test ./tests/Unit --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger trx --results-directory ./artifacts/test-results/unit
    - name: Run Endpoints Integration Tests
      run: dotnet test ./tests/Integration.Endpoints --no-build --verbosity normal --logger trx --results-directory ./artifacts/test-results/integration
    - name: Build Docker Containers
      shell: pwsh
      run: ./scripts/Build-Container.ps1
    - name: Install Playwright Chromium
      shell: pwsh
      run: ./tests/Functional/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
    - name: Start Docker Containers
      shell: pwsh
      run: ./scripts/Start-Container.ps1 -NoBrowser
    - name: Run Functional Tests
      shell: pwsh
      run: ./scripts/Run-Tests.ps1 -Functional -RunSettings tests/Functional/runsettings/container.runsettings -ResultsDirectory artifacts/test-results/functional
    - name: Collect Docker Logs
      if: always()
      run: |
        mkdir -p artifacts
        docker compose -f docker/docker-compose-ci.yml logs --no-color > artifacts/docker.log 2>&1
    - name: Stop Docker Containers
      if: always()
      shell: pwsh
      run: ./scripts/Stop-Container.ps1
    - name: Upload Docker Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: artifacts/docker.log
    - name: Publish Test Report
      if: ${{ always() && hashFiles('artifacts/test-results/**/*.trx') != '' }}
      uses: dorny/test-reporter@v3
      with:
        name: .NET Test Results
        path: artifacts/test-results/**/*.trx
        reporter: dotnet-trx
        use-actions-summary: 'true'
        list-tests: all
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: artifacts/test-results/
        if-no-files-found: ignore
