name: Build

on:
  push:
    branches: [ main ]

env:
  SOLUTION_VERSION: 'github-${{ github.sha }}'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run Unit Tests
      run: dotnet test ./tests/Unit --no-build --verbosity normal --collect:"XPlat Code Coverage"
    - name: Run Endpoints Integration Tests
      run: dotnet test ./tests/Integration.Endpoints --no-build --verbosity normal
    - name: Build Docker Containers
      shell: pwsh
      run: ./scripts/Build-Container.ps1
    - name: Install Playwright Chromium
      shell: pwsh
      run: ./tests/Functional/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
    - name: Start Docker Containers
      shell: pwsh
      run: ./scripts/Start-Container.ps1 -NoBrowser
    - name: Run Functional Tests
      shell: pwsh
      run: ./scripts/Run-Tests.ps1 -Functional -RunSettings tests/Functional/runsettings/container.runsettings
    - name: Collect Docker Logs
      if: always()
      run: |
        mkdir -p artifacts
        docker compose -f docker/docker-compose-ci.yml logs --no-color > artifacts/docker.log 2>&1
    - name: Stop Docker Containers
      if: always()
      shell: pwsh
      run: ./scripts/Stop-Container.ps1
    - name: Upload Docker Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: artifacts/docker.log
